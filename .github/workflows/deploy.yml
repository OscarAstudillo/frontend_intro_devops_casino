name: CI/CD Pipeline Casino Frontend a EKS

on:
  push:
    branches:
      - deploy # La rúbrica exige que se dispare al hacer push a la rama deploy[cite: 6]

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: vidalcasino-eks # El nombre de tu clúster EKS
  ECR_REPOSITORY: frontend_intro_devops_casino # <--- AQUÍ ESTÁ EL CAMBIO CLAVE

jobs:
  build-push-deploy:
    name: Construir, Subir a ECR y Desplegar en EKS
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Construir, etiquetar y publicar la imagen
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # La rúbrica exige 3 tags: latest, el SHA del commit, y una versión V.X.Y.Z[cite: 6]
          docker build -t $REGISTRY/$ECR_REPOSITORY:latest -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:v2.0.1 .
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:v2.0.1

      - name: 5. Instalar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: 6. Conectar kubectl al clúster EKS
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: 7. Desplegar en Kubernetes
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Obtener el Account ID dinámicamente
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          # Inyectar dinámicamente el Account ID, la Región y el Tag exacto en el manifiesto deployment.yaml[cite: 2]
          sed -i "s|<ACCOUNT_ID>|$ACCOUNT_ID|g; s|<REGION>|${{ env.AWS_REGION }}|g; s|:latest|:$IMAGE_TAG|g" k8s/deployment.yaml
          
          # Aplicar los manifiestos en el clúster[cite: 2, 6]
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml